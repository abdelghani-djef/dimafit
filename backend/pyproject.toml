[project]
name = "dimafit"
version = "0.1.0"
description = "Workout plans and nutrition targets from a goal and body measurements, in English, French and Arabic."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
